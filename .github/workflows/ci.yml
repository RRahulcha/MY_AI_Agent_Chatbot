name: SETTribe AMS CI Pipeline

on:
  push:
    branches: [ "tusharsingh", "main", "master", "dev" ]
  pull_request:
    branches: [ "tusharsingh", "main", "master", "dev" ]

jobs:
  php-lint:
    name: PHP Syntax & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, gd, zip, curl, bcmath

      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*" -print0 | xargs -0 -n 1 -P 4 php -l

  python-lint:
    name: AI Service Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python Syntax
        run: |
          python -m py_compile ai_service/app.py ai_service/db_manager.py ai_service/face_engine.py

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Docker Image
        run: |
          docker build -t settribe-ams-web:latest -f Dockerfile .

      - name: Build AI Service Docker Image
        run: |
          docker build -t settribe-ams-ai:latest -f ai_service/Dockerfile .
